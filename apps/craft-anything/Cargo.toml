[package]
name = "craft-anything"
description = "Craft Anything: find out how any software works, then craft your own"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[lints]
workspace = true

[dependencies]
craft-anything-engine = { workspace = true }
craft-anything-platform = { workspace = true }
craft-anything-ai = { workspace = true }
craft-anything-setup = { workspace = true }
craft-anything-ui-egui = { workspace = true }
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "wayland", "x11", "persistence"] }
log = { workspace = true }
# The one dialog the app shows itself: when its window can't open, so a start that shows nothing
# still says why (#166).

[features]
wasm-plugins = ["craft-anything-engine/wasm-plugins"]

[build-dependencies]
# Icon + VERSIONINFO for craft-anything.exe; build.rs only uses it when targeting Windows.
winresource = "0.1"

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
eframe = { workspace = true, features = ["android-native-activity"] }

[target.'cfg(not(target_os = "android"))'.dependencies]
rfd = { workspace = true }

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.android]
package = "com.shinnmm6.craftandroid"
apk_name = "CraftAndroid"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 34

[package.metadata.android.application]
label = "Craft Android"

[[package.metadata.android.uses_permission]]
name = "android.permission.INTERNET"
